name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: macOS
            os: macos-latest
            ocaml: 4.14
            test_disabled:
          - name: Windows
            os: windows-latest
            ocaml: 4.14
            # Same subsystems as before. They still exist under test-suite/.
            test_disabled: misc coq-makefile precomputed-time-tests
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5.4
            test_disabled:
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # `make world` compiles Corelib, Soma's libraries, and the vendored
    # Stdlib (582 .v files under theories/Stdlib). The previous limit was
    # 45 minutes, carried over from the Rocq workflow this file still
    # followed, which did not build that Stdlib here. 120 is headroom for
    # world plus the test suite on the slower runners. This budget was
    # not timed in this environment.
    timeout-minutes: 120
    steps:
      - name: 🐛 Special macOS Config
        if: matrix.os == 'macos-latest'
        run: brew install gnu-time

      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      # Cygwin's pkgconf 3.0.4-1 (2026-07-26) compiles its personality search
      # path as /usr/lib/pkgconfig/personality.d:/usr/share/pkgconfig/personality.d
      # but still installs the mingw-w64 personality files under
      # /etc/pkgconfig/personality.d, so `pkgconf --personality=<triplet>`
      # silently falls back to the native personality and the
      # conf-mingw-w64-{gmp,zlib}-* opam packages fail their probes.  pkgconf
      # also searches $XDG_DATA_DIRS/pkgconfig/personality.d, so prepending /etc
      # restores the lookup.  Drop this once Cygwin ships a fixed pkgconf
      # packaging.
      - name: 🩹 Work around Cygwin pkgconf 3.0.4-1 personality path bug
        if: matrix.os == 'windows-latest'
        run: |
          "XDG_DATA_DIRS=/etc:/usr/local/share:/usr/share" >> $env:GITHUB_ENV

      # soma-runtime.opam, soma-core.opam, and soma-test-suite.opam.
      # ./rocq*.opam and ./rocq-*.opam match nothing in this tree. The
      # paths are listed because PowerShell does not expand globs for
      # native commands. --deps-only installs wasm (>= 2.0.2) from
      # soma-runtime, and ounit2, conf-python-3, and conf-time from
      # soma-test-suite. It does not install these three packages;
      # `make world` builds the first two.
      - name: Get Soma dependencies
        run: opam install --deps-only ./soma-runtime.opam ./soma-core.opam ./soma-test-suite.opam

      # dunestrap, then dune build of soma-runtime.install and
      # soma-core.install (Corelib, Stdlib, Soma's libraries).
      - name: Build Soma
        run: opam exec -- make world

      # test-suite/Makefile uses _build/install/default/bin/rocq.
      # The root `make test-suite` target is `dune runtest` and does not
      # take DISABLED_SUBSYSTEMS.
      - name: Test Soma
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'
